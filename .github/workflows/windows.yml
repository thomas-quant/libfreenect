name: windows

on:
  push:
    branches: [windows-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: vcpkg install libusb pthreads freeglut --triplet x64-windows

      - name: Configure
        shell: pwsh
        run: |
          $v = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DLIBUSB_1_INCLUDE_DIR="$v/include/libusb-1.0" `
            -DLIBUSB_1_LIBRARY="$v/lib/libusb-1.0.lib" `
            -DTHREADS_PTHREADS_INCLUDE_DIR="$v/include" `
            -DTHREADS_PTHREADS_WIN32_LIBRARY="$v/lib/pthreadVC3.lib" `
            -DBUILD_FAKENECT=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Collect
        shell: pwsh
        run: |
          $v = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          New-Item -ItemType Directory out | Out-Null
          Copy-Item build/bin/Release/*.exe out/
          Get-ChildItem build -Recurse -Filter *.dll | Copy-Item -Destination out/ -Force
          Copy-Item "$v/bin/*.dll" out/ -Force
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: libfreenect-windows-x64
          path: out/
